<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1c27"/>
      <stop offset="100%" stop-color="#141118"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad3)"/>
  
  <!-- Cute Heart Glasses & Bowtie doodle -->
  <g transform="translate(110, 110)">
    <!-- Heart Glasses Left -->
    <path d="M 40 50 C 15 25, 0 55, 40 85 C 80 55, 65 25, 40 50 Z" fill="#ff7597" stroke="#ffe5ec" stroke-width="4"/>
    <!-- Heart Glasses Right -->
    <path d="M 140 50 C 115 25, 100 55, 140 85 C 180 55, 165 25, 140 50 Z" fill="#ff7597" stroke="#ffe5ec" stroke-width="4"/>
    <!-- Bridge -->
    <path d="M 68 55 Q 90 45 112 55" fill="none" stroke="#ffe5ec" stroke-width="4"/>
    <!-- Cute Smile -->
    <path d="M 70 115 Q 90 135 110 115" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <!-- Bowtie -->
    <polygon points="65,145 115,145 90,160" fill="#ff4d6d"/>
    <polygon points="65,175 115,175 90,160" fill="#ff4d6d"/>
    <circle cx="90" cy="160" r="7" fill="#ffe5ec"/>
  </g>

  <text x="60" y="90" font-size="28" fill="#ffb3c6">✨</text>
  <text x="310" y="80" font-size="28" fill="#ffb3c6">⭐</text>
  <text x="320" y="310" font-size="24" fill="#ffb3c6">🌸</text>

  <text x="200" y="320" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="26" font-weight="bold" fill="#ffe5ec">
    Unfiltered Happiness
  </text>
  <text x="200" y="348" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="14" fill="#ffb3c6">
    (Click 'Swap Photos Live' to add yours!)
  </text>
</svg>
