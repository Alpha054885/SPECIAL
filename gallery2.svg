<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 340" width="100%" height="100%">
  <defs>
    <linearGradient id="gGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#321e2a"/>
      <stop offset="100%" stop-color="#181320"/>
    </linearGradient>
  </defs>
  <rect width="450" height="340" fill="url(#gGrad2)"/>
  
  <!-- Cute Message Bubble doodle -->
  <g transform="translate(125, 60)">
    <rect x="0" y="0" width="200" height="130" rx="20" fill="#ffb3c6" stroke="#fff" stroke-width="4"/>
    <polygon points="40,130 65,130 35,160" fill="#ffb3c6"/>
    
    <text x="100" y="55" text-anchor="middle" font-family="'Patrick Hand', cursive, sans-serif" font-size="22" font-weight="bold" fill="#2b232a">
      "Sending this to you!"
    </text>
    <text x="100" y="90" text-anchor="middle" font-size="28">💌😜</text>
  </g>

  <text x="50" y="270" font-size="26" fill="#ff7597">💖</text>
  <text x="380" y="250" font-size="26" fill="#ff7597">✨</text>

  <text x="225" y="270" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#fff">
    The Random Chat Candid
  </text>
  <text x="225" y="300" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="14" fill="#ffb3c6">
    (Photo you shared with me)
  </text>
</svg>
