<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSleep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b2d"/>
      <stop offset="100%" stop-color="#14101b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradSleep)"/>
  
  <!-- Cute Sleeping Pillow & Moon Doodle -->
  <g transform="translate(100, 110)">
    <!-- Fluffy Pillow -->
    <rect x="20" y="50" width="160" height="90" rx="28" fill="#ffb3c6" stroke="#fff" stroke-width="4"/>
    <!-- Sleeping Eyes on pillow -->
    <path d="M 60 90 Q 75 105 90 90" fill="none" stroke="#2b232a" stroke-width="4" stroke-linecap="round"/>
    <path d="M 110 90 Q 125 105 140 90" fill="none" stroke="#2b232a" stroke-width="4" stroke-linecap="round"/>
    <!-- Cute pink blush -->
    <circle cx="50" cy="95" r="7" fill="#ff4d6d" opacity="0.6"/>
    <circle cx="150" cy="95" r="7" fill="#ff4d6d" opacity="0.6"/>
    <!-- Sleeping Zzz -->
    <text x="140" y="40" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#ffe5ec">Z</text>
    <text x="165" y="25" font-family="'Caveat', cursive, sans-serif" font-size="34" font-weight="bold" fill="#ff7597">z</text>
    <text x="190" y="10" font-family="'Caveat', cursive, sans-serif" font-size="40" font-weight="bold" fill="#ff4d6d">z</text>
  </g>

  <!-- Stars & Moon -->
  <text x="70" y="90" font-size="30" fill="#ffb3c6">🌙</text>
  <text x="310" y="100" font-size="24" fill="#ffb3c6">⭐</text>
  <text x="70" y="320" font-size="24" fill="#ffb3c6">✨</text>
  <text x="310" y="320" font-size="24" fill="#ffb3c6">💤</text>

  <text x="200" y="315" text-anchor="middle" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="bold" fill="#ffe5ec">
    Kitha sote ho yr! 😴
  </text>
  <text x="200" y="345" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="14" fill="#ffb3c6">
    (Click 'Swap Photos Live' to add real photo!)
  </text>
</svg>
